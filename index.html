<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Спутник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1330; --bg-deep:#140D26;
    --surface:rgba(255,255,255,.045); --surface-strong:rgba(255,255,255,.075); --surface-hover:rgba(255,255,255,.1);
    --border:rgba(255,255,255,.09);
    --accent:#FF5D8F; --accent-soft:rgba(255,93,143,.14);
    --lilac:#B9A6FF; --lilac-soft:rgba(185,166,255,.14);
    --teal:#6FD3C7; --teal-soft:rgba(111,211,199,.14);
    --gold:#FFC65C; --gold-soft:rgba(255,198,92,.14);
    --text:#F3EFFF; --text-muted:#9E97C0; --text-faint:#6E6790; --danger:#FF6B6B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(circle at 15% 0%, rgba(185,166,255,.10), transparent 45%),
      radial-gradient(circle at 100% 20%, rgba(255,93,143,.08), transparent 40%), var(--bg);
    color:var(--text); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{background:var(--accent);color:#1A1330;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}

  .app{display:flex;height:100vh;width:100vw;}

  .sidebar{width:236px;flex-shrink:0;background:rgba(255,255,255,.02);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 14px;backdrop-filter:blur(20px);}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 10px 26px 10px;}
  .brand-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,var(--accent),var(--lilac));display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;color:#1A1330;flex-shrink:0;}
  .brand-name{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;letter-spacing:.2px;}
  .nav{display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:transparent;border:none;color:var(--text-muted);font-size:14.5px;font-weight:600;text-align:left;transition:background .15s ease,color .15s ease;}
  .nav-item svg{flex-shrink:0;opacity:.8;}
  .nav-item:hover{background:var(--surface);color:var(--text);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);}
  .nav-item.active svg{opacity:1;}
  .profile-box{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface);margin-top:10px;border:1px solid var(--border);}
  .avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;color:#1A1330;}
  .profile-box .who{flex:1;min-width:0;}
  .profile-box .who .name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .profile-box .who .sub{font-size:11px;color:var(--text-faint);}
  .profile-box button{background:none;border:none;color:var(--text-faint);padding:4px;border-radius:6px;}
  .profile-box button:hover{color:var(--text);background:var(--surface-hover);}

  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 28px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;}
  .topbar h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin:0;}
  .topbar .desc{font-size:12.5px;color:var(--text-faint);margin-top:3px;}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:9px 16px;min-width:230px;flex:0 1 320px;}
  .searchbar:focus-within{border-color:var(--lilac);}
  .searchbar svg{flex-shrink:0;color:var(--text-faint);}
  .searchbar input{background:none;border:none;outline:none;color:var(--text);font-size:13.5px;width:100%;}
  .searchbar input::placeholder{color:var(--text-faint);}
  .searchbar .clear{background:none;border:none;color:var(--text-faint);padding:0 2px;font-size:15px;display:none;}
  .searchbar.has-val .clear{display:block;}
  .content{flex:1;overflow-y:auto;padding:24px 28px 40px;position:relative;}
  .content.no-pad{padding:0;}

  .btn{background:var(--accent);color:#1A1330;border:none;padding:10px 18px;border-radius:12px;font-weight:700;font-size:13.5px;transition:filter .15s ease, transform .1s ease;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{filter:brightness(1.1);}
  .btn:active{transform:scale(.97);}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn.ghost:hover{background:var(--surface);}
  .btn.small{padding:7px 13px;font-size:12.5px;}
  .btn.danger{background:var(--danger);color:#2b0d0d;}
  .btn:disabled{opacity:.45;cursor:default;}
  .icon-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s;}
  .icon-btn:hover{background:var(--surface-hover);color:var(--text);}
  .icon-btn.active-rec{background:var(--danger);color:#fff;border-color:var(--danger);}

  .pill-toggle{display:flex;background:var(--surface);border-radius:11px;padding:3px;gap:2px;border:1px solid var(--border);}
  .pill-toggle button{background:none;border:none;color:var(--text-muted);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:9px;}
  .pill-toggle button.active{background:var(--accent);color:#1A1330;}

  /* ---------- Chats ---------- */
  .chats-layout{display:flex;height:100%;}
  .chat-list{width:300px;border-right:1px solid var(--border);flex-shrink:0;overflow-y:auto;}
  .chat-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);}
  .chat-row:hover{background:var(--surface);cursor:pointer;}
  .chat-row.active{background:var(--surface-strong);border-left:3px solid var(--accent);padding-left:17px;}
  .chat-row .meta{flex:1;min-width:0;}
  .chat-row .meta .top{display:flex;justify-content:space-between;gap:6px;}
  .chat-row .meta .cname{font-weight:700;font-size:14px;}
  .chat-row .meta .ctime{font-size:11px;color:var(--text-faint);flex-shrink:0;}
  .chat-row .meta .last{font-size:12.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}

  .thread{flex:1;display:flex;flex-direction:column;min-width:0;}
  .thread-head{padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .thread-head .name{font-weight:700;font-size:15px;}
  .thread-head .status{font-size:12px;color:var(--lilac);}
  .thread-head .spacer{flex:1;}
  .thread-body{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
  .bubble{max-width:60%;padding:10px 14px;border-radius:15px;font-size:14px;line-height:1.45;}
  .bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),#FF7FA8);color:#1A1330;border-bottom-right-radius:4px;}
  .bubble.them{align-self:flex-start;background:var(--surface-strong);border:1px solid var(--border);border-bottom-left-radius:4px;}
  .bubble.call-log{align-self:center;background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:12.5px;padding:7px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;}
  .bubble .time{display:block;font-size:10px;opacity:.65;margin-top:4px;}
  .voice-row{display:flex;align-items:center;gap:9px;min-width:150px;}
  .voice-row button{background:rgba(0,0,0,.15);border:none;color:inherit;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .bubble.them .voice-row button{background:var(--surface-hover);}
  .voice-wave{flex:1;height:20px;display:flex;align-items:center;gap:2px;}
  .voice-wave span{width:3px;border-radius:2px;background:currentColor;opacity:.55;}
  .voice-dur{font-size:11px;opacity:.75;flex-shrink:0;}

  .thread-input{display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--border);position:relative;}
  .thread-input input[type=text]{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:14px;font-size:14px;outline:none;}
  .thread-input input[type=text]:focus{border-color:var(--lilac);}
  .rec-indicator{display:flex;align-items:center;gap:8px;flex:1;color:var(--danger);font-size:13px;font-weight:700;padding:0 6px;}
  .rec-dot{width:9px;height:9px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .empty-thread{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:14px;}

  /* Emoji popup */
  .emoji-popup{position:absolute;bottom:64px;left:20px;width:280px;max-height:220px;overflow-y:auto;background:#221A3D;border:1px solid var(--border);border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;z-index:30;box-shadow:0 14px 40px rgba(0,0,0,.4);}
  .emoji-popup button{background:none;border:none;font-size:19px;padding:5px 0;border-radius:8px;}
  .emoji-popup button:hover{background:var(--surface-hover);}

  /* ---------- Call modal ---------- */
  .call-overlay{position:fixed;inset:0;background:rgba(8,4,18,.92);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text);}
  .call-demo-badge{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:var(--surface-strong);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-size:11.5px;color:var(--text-muted);max-width:88%;text-align:center;}
  .call-avatar{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:700;color:#1A1330;margin-bottom:18px;}
  .call-name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
  .call-status{color:var(--text-muted);font-size:13.5px;margin-top:4px;}
  .call-local-video{position:absolute;bottom:110px;right:26px;width:150px;height:110px;border-radius:14px;overflow:hidden;background:#000;border:1px solid var(--border);}
  .call-local-video video{width:100%;height:100%;object-fit:cover;}
  .call-controls{position:absolute;bottom:34px;display:flex;gap:16px;}
  .call-controls button{width:54px;height:54px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;background:var(--surface-strong);color:var(--text);}
  .call-controls button.end{background:var(--danger);color:#2b0d0d;}
  .call-controls button.on{background:var(--lilac);color:#1A1330;}

  /* ---------- Feed ---------- */
  .composer{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:22px;}
  .composer textarea{width:100%;background:transparent;border:none;color:var(--text);resize:none;font-size:14.5px;outline:none;min-height:50px;line-height:1.5;}
  .media-preview{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--border);position:relative;max-width:320px;}
  .media-preview img,.media-preview video{width:100%;display:block;max-height:280px;object-fit:cover;background:#000;}
  .media-preview .remove-media{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);border:none;color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .media-preview .music-tag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;}
  .attach-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .attach-btn{display:flex;align-items:center;gap:6px;background:var(--surface-strong);border:1px solid var(--border);color:var(--text-muted);padding:7px 12px;border-radius:20px;font-size:12.5px;font-weight:600;}
  .attach-btn:hover{color:var(--text);background:var(--surface-hover);}
  .attach-btn:disabled{opacity:.4;cursor:default;}
  .attach-btn.active{color:var(--lilac);border-color:var(--lilac);}
  .composer-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .privacy-toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-muted);}
  .switch{width:36px;height:20px;border-radius:20px;background:var(--surface-strong);position:relative;border:1px solid var(--border);flex-shrink:0;}
  .switch .knob{width:14px;height:14px;border-radius:50%;background:var(--text-muted);position:absolute;top:2px;left:3px;transition:all .15s ease;}
  .switch.on{background:var(--lilac-soft);border-color:var(--lilac);}
  .switch.on .knob{background:var(--lilac);left:19px;}

  .feed-grid{display:flex;flex-direction:column;gap:14px;max-width:640px;}
  .post-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;}
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .post-head .pname{font-weight:700;font-size:13.5px;}
  .post-head .ptime{font-size:11.5px;color:var(--text-faint);}
  .post-head .lock{margin-left:auto;font-size:11px;color:var(--text-muted);display:flex;align-items:center;gap:4px;background:var(--surface-strong);padding:3px 9px;border-radius:20px;}
  .post-text{font-size:14.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;}
  .post-media{margin-top:10px;border-radius:14px;overflow:hidden;position:relative;}
  .post-media img{width:100%;display:block;}
  .post-media .video-frame{position:relative;background:#000;}
  .post-media .video-frame img{opacity:.8;}
  .post-media .video-frame .playbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .post-media .video-frame .dur-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;}
  .post-media .music-tag{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;}
  .post-foot{display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
  .like-btn{background:none;border:none;color:var(--text-muted);font-size:13px;display:flex;align-items:center;gap:6px;}
  .like-btn:hover{color:var(--accent);}
  .like-btn.liked{color:var(--accent);}

  /* ---------- Public chat ---------- */
  .public-wrap{display:flex;flex-direction:column;height:100%;}
  .public-head{padding:14px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
  .public-head .name{font-weight:700;font-size:14.5px;}
  .public-head .sub{font-size:11.5px;color:var(--text-faint);}
  .public-head .spacer{flex:1;}
  .public-body{flex:1;overflow-y:auto;padding:20px 28px;display:flex;flex-direction:column;gap:12px;}
  .pmsg{display:flex;gap:10px;max-width:640px;}
  .pmsg .pmsg-name{font-weight:700;font-size:13px;margin-bottom:2px;}
  .pmsg .pmsg-text{font-size:14px;background:var(--surface-strong);border:1px solid var(--border);padding:9px 13px;border-radius:13px;border-top-left-radius:3px;line-height:1.5;}
  .pmsg.mine .pmsg-text{background:var(--accent-soft);border:1px solid rgba(255,93,143,.3);}
  .pmsg.call-log{align-self:center;color:var(--text-muted);font-size:12.5px;}
  .public-input{display:flex;align-items:center;gap:10px;padding:14px 28px;border-top:1px solid var(--border);position:relative;}
  .public-input input[type=text]{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:11px 16px;border-radius:14px;outline:none;font-size:14px;}
  .public-input input[type=text]:focus{border-color:var(--lilac);}

  /* ---------- Channels ---------- */
  .channels-toolbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:20px;}
  .channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .channel-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;cursor:pointer;transition:border-color .15s ease;}
  .channel-card:hover{border-color:var(--lilac);}
  .channel-cover{width:100%;height:80px;border-radius:13px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:rgba(26,19,48,.65);}
  .channel-card .cname{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .channel-card .cdesc{font-size:12px;color:var(--text-muted);line-height:1.4;min-height:32px;}
  .channel-card .cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--text-faint);}
  .badge-lock{background:var(--surface-strong);padding:2px 8px;border-radius:20px;color:var(--text-muted);white-space:nowrap;}
  .badge-live{background:var(--danger);color:#2b0d0d;padding:2px 9px;border-radius:20px;font-weight:700;}

  .channel-detail-head{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .channel-detail-head .cover-lg{width:64px;height:64px;border-radius:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;color:rgba(26,19,48,.65);}
  .back-link{background:none;border:none;color:var(--text-muted);font-size:13px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:6px;}
  .back-link:hover{color:var(--text);}
  .video-post{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:14px;max-width:520px;}
  .video-thumb{width:100%;height:180px;display:flex;align-items:center;justify-content:center;position:relative;background:#000;}
  .video-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.75;}
  .video-thumb .dur-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;z-index:2;}
  .video-info{padding:14px 16px;}
  .video-info .vtitle{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .video-info .vdesc{font-size:12.5px;color:var(--text-muted);line-height:1.5;}
  .video-info .vfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text-faint);gap:8px;flex-wrap:wrap;}

  /* Floating action button for channel owner */
  .fab-wrap{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;align-items:center;}
  .fab{width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,var(--accent),var(--lilac));border:none;color:#1A1330;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(255,93,143,.35);transition:transform .15s ease;}
  .fab:hover{transform:scale(1.06);}
  .fab-menu{position:absolute;bottom:66px;background:#221A3D;border:1px solid var(--border);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;width:230px;box-shadow:0 14px 40px rgba(0,0,0,.4);}
  .fab-menu button{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--text);font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;text-align:left;}
  .fab-menu button:hover{background:var(--surface-hover);}
  .fab-menu button svg{color:var(--lilac);flex-shrink:0;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,6,20,.65);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#221A3D;border:1px solid var(--border);border-radius:20px;padding:24px;width:440px;max-width:100%;max-height:88vh;overflow-y:auto;}
  .modal h3{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 16px;font-weight:700;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:6px;font-weight:600;}
  .field input,.field textarea{width:100%;background:var(--surface-strong);border:1px solid var(--border);color:var(--text);padding:10px 13px;border-radius:11px;outline:none;font-size:14px;}
  .field input:focus,.field textarea:focus{border-color:var(--lilac);}
  .field textarea{resize:none;min-height:70px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .access-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .access-opt{display:flex;align-items:flex-start;gap:9px;background:var(--surface-strong);border:1px solid var(--border);border-radius:12px;padding:10px 12px;text-align:left;color:var(--text-muted);}
  .access-opt svg{flex-shrink:0;margin-top:2px;}
  .access-opt .at{font-size:12.5px;font-weight:700;color:var(--text);display:block;}
  .access-opt .as{font-size:10.5px;color:var(--text-faint);}
  .access-opt.active{border-color:var(--lilac);background:var(--lilac-soft);}
  .access-opt.active .at{color:var(--lilac);}
  .video-drop{border:1.5px dashed var(--border);border-radius:14px;padding:16px;text-align:center;color:var(--text-muted);font-size:12.5px;cursor:pointer;}
  .video-drop:hover{border-color:var(--lilac);color:var(--text);}
  .video-drop-preview{border-radius:12px;overflow:hidden;margin-bottom:10px;}
  .video-drop-preview video,.video-drop-preview img{width:100%;max-height:200px;object-fit:cover;display:block;background:#000;}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-faint);text-align:center;gap:10px;}
  .empty-state svg{opacity:.5;margin-bottom:6px;}
  .empty-state .es-title{font-weight:700;color:var(--text-muted);font-size:14.5px;}
  .empty-state .es-sub{font-size:12.5px;max-width:280px;}
  .loading-line{color:var(--text-faint);font-size:13px;padding:20px 0;}
  mark{background:var(--lilac-soft);color:var(--lilac);border-radius:3px;padding:0 1px;}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#221A3D;border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:12px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.4);}

  .mobile-tabbar{display:none;}
  @media (max-width:820px){
    .sidebar{display:none;}
    .app{flex-direction:column;}
    .main{height:calc(100vh - 62px);}
    .mobile-tabbar{display:flex;height:62px;flex-shrink:0;background:rgba(255,255,255,.03);border-top:1px solid var(--border);order:2;}
    .mobile-tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-faint);font-size:10px;font-weight:700;}
    .mobile-tabbar button.active{color:var(--accent);}
    .chat-list{width:100%;}
    .chat-list.hide-mobile,.thread.hide-mobile{display:none;}
    .thread{display:none;}
    .thread.show-mobile{display:flex;}
    .bubble{max-width:80%;}
    .topbar{padding:14px 18px;}
    .content{padding:16px 18px 30px;}
    .searchbar{flex:1 1 100%;}
    .access-grid{grid-template-columns:1fr;}
    .call-local-video{width:100px;height:76px;right:16px;bottom:100px;}
  }
</style>
</head>

const AV_COLORS = ['#FF5D8F','#B9A6FF','#6FD3C7','#FFC65C','#7FA8FF','#FF8FC0'];
function colorFor(seed){ let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0; return AV_COLORS[h % AV_COLORS.length]; }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function timeAgo(ts){ const d=Date.now()-ts,m=Math.floor(d/60000); if(m<1)return 'сейчас'; if(m<60)return m+' мин'; const h=Math.floor(m/60); if(h<24)return h+' ч'; return Math.floor(h/24)+' дн'; }
function fmtClock(ts){ const d=new Date(ts); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function fmtDur(sec){ sec=Math.round(sec); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function highlight(text,q){ if(!q) return esc(text); const src=text||''; const idx=src.toLowerCase().indexOf(q.toLowerCase()); if(idx===-1) return esc(text); return esc(src.slice(0,idx))+'<mark>'+esc(src.slice(idx,idx+q.length))+'</mark>'+esc(src.slice(idx+q.length)); }
function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ root.innerHTML=''; }, 3200);
}

async function sGet(key, shared){ try{ const r=await window.storage.get(key, !!shared); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sSet(key, value, shared){ try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }catch(e){ console.error('storage set failed', e); return false; } }

let state = {
  profile:null, chats:[], activeChatId:null,
  feed:[], myPostIds:[],
  publicChat:[],
  channels:[], channelPosts:[], myChannelIds:[], activeChannelId:null,
  tab:'chats', mobileThreadOpen:false, ready:false, search:'',
};

const SEED_CONTACTS = [
  {id:'c1', name:'Анна', color:AV_COLORS[1], online:true, messages:[{type:'text', from:'them', text:'Привет! Как дела?', time:Date.now()-3600_000}]},
  {id:'c2', name:'Тимур', color:AV_COLORS[2], online:false, messages:[{type:'text', from:'them', text:'Скинь, пожалуйста, файл сегодня', time:Date.now()-7200_000}]},
  {id:'c3', name:'Семейный чат', color:AV_COLORS[3], online:true, messages:[{type:'text', from:'them', text:'Встречаемся в 19:00', time:Date.now()-1800_000}]},
];
const CANNED_REPLIES = ['Хорошо, договорились 👍','Понял, напишу позже.','Да, согласен.','Интересно, расскажи подробнее.','Сейчас занят, но сообщение видел.','Спасибо! 😊'];

async function loadAll(){
  const [profile, chats, feed, myPostIds, publicChat, channels, channelPosts, myChannelIds] = await Promise.all([
    sGet('sputnik_profile_v1', false), sGet('sputnik_chats_v2', false),
    sGet('sputnik_feed_v2', true), sGet('sputnik_myposts_v1', false),
    sGet('sputnik_publicchat_v2', true),
    sGet('sputnik_channels_v2', true), sGet('sputnik_channelposts_v2', true), sGet('sputnik_mychannels_v1', false),
  ]);
  state.profile = profile || { name:'Гость', color: colorFor(uid()) };
  if(!profile) await sSet('sputnik_profile_v1', state.profile, false);
  state.chats = chats || SEED_CONTACTS;
  if(!chats) await sSet('sputnik_chats_v2', state.chats, false);
  state.feed = feed || [];
  state.myPostIds = myPostIds || [];
  state.publicChat = publicChat || [{id:uid(), type:'text', author:'Спутник', text:'Добро пожаловать в общий чат! Здесь могут писать, звонить и отправлять голосовые все.', time:Date.now()-7200_000}];
  if(!publicChat) await sSet('sputnik_publicchat_v2', state.publicChat, true);
  state.channels = channels || [];
  state.channelPosts = channelPosts || [];
  state.myChannelIds = myChannelIds || [];
  state.ready = true;
  render();
}

const NAV = [
  {id:'chats', label:'Чаты', icon:'chats'},
  {id:'feed', label:'Лента', icon:'feed'},
  {id:'public', label:'Общий чат', icon:'public'},
  {id:'channels', label:'Каналы', icon:'channels'},
];

function setTab(t){ state.tab=t; state.mobileThreadOpen=false; state.activeChannelId=null; state.search=''; closeEmoji(); render(); }

function render(){
  if(!state.ready) return;
  renderNav(); renderProfileBox(); renderTopbar(); renderMobileTabbar(); renderContent();
}
function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = NAV.map(item=>`<button class="nav-item ${state.tab===item.id?'active':''}" data-tab="${item.id}">${ICONS[item.icon]}<span>${item.label}</span></button>`).join('');
  nav.querySelectorAll('.nav-item').forEach(b=> b.addEventListener('click', ()=>setTab(b.dataset.tab)));
}
function renderProfileBox(){
  const el = document.getElementById('profileBox');
  el.innerHTML = `<div class="avatar" style="background:${state.profile.color}">${initials(state.profile.name)}</div>
    <div class="who"><div class="name">${esc(state.profile.name)}</div><div class="sub">Мой профиль</div></div>
    <button id="editProfileBtn" title="Изменить имя">✎</button>`;
  document.getElementById('editProfileBtn').addEventListener('click', openProfileModal);
}
function renderMobileTabbar(){
  const el = document.getElementById('mobileTabbar');
  el.innerHTML = NAV.map(item=>`<button class="${state.tab===item.id?'active':''}" data-tab="${item.id}">${ICONS[item.icon]}<span>${item.label}</span></button>`).join('');
  el.querySelectorAll('button').forEach(b=> b.addEventListener('click', ()=>setTab(b.dataset.tab)));
}
const SEARCH_PLACEHOLDER = {chats:'Искать по чатам…', feed:'Искать по ленте…', public:'Искать в общем чате…', channels:'Искать каналы…'};
function renderTopbar(){
  const el = document.getElementById('topbar');
  const titles = {
    chats:['Чаты','Личные переписки — звонки, голосовые, эмодзи'],
    feed:['Лента','Фото, видео до 5 минут и музыка — публично или для себя'],
    public:['Общий чат','Один чат для всех — со звонками и голосовыми'],
    channels:['Каналы','Видео без ограничений, трансляции, гибкий доступ'],
  };
  let [title,desc] = titles[state.tab];
  if(state.tab==='channels' && state.activeChannelId){
    const ch = state.channels.find(c=>c.id===state.activeChannelId);
    if(ch){ title = ch.name; desc = 'Публикации канала'; }
  }
  el.innerHTML = `
    <div><h1>${esc(title)}</h1><div class="desc">${esc(desc)}</div></div>
    <div class="searchbar ${state.search?'has-val':''}" id="searchbar">
      ${ICONS.search}<input type="text" id="searchInput" placeholder="${SEARCH_PLACEHOLDER[state.tab]}" value="${esc(state.search)}" autocomplete="off">
      <button class="clear" id="clearSearch">×</button>
    </div>`;
  const input = document.getElementById('searchInput');
  input.addEventListener('input', ()=>{ state.search=input.value; document.getElementById('searchbar').classList.toggle('has-val', !!state.search); renderContent(); });
  document.getElementById('clearSearch').addEventListener('click', ()=>{ state.search=''; input.value=''; input.focus(); document.getElementById('searchbar').classList.remove('has-val'); renderContent(); });
}
function renderContent(){
  const el = document.getElementById('content');
  el.className = 'content' + (state.tab==='chats' || state.tab==='public' ? ' no-pad' : '');
  if(state.tab==='chats') return renderChats(el);
  if(state.tab==='feed') return renderFeed(el);
  if(state.tab==='public') return renderPublicChat(el);
  if(state.tab==='channels') return renderChannels(el);
}

/* ================= EMOJI PICKER (shared) ================= */
let emojiTarget = null; // {inputId, context}
function closeEmoji(){ const p=document.getElementById('emojiPopup'); if(p) p.remove(); emojiTarget=null; }
function toggleEmoji(anchorParent, inputId){
  const existing = document.getElementById('emojiPopup');
  if(existing){ closeEmoji(); return; }
  emojiTarget = inputId;
  const pop = document.createElement('div');
  pop.className = 'emoji-popup'; pop.id = 'emojiPopup';
  pop.innerHTML = EMOJIS.map(e=>`<button type="button">${e}</button>`).join('');
  anchorParent.appendChild(pop);
  pop.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const input = document.getElementById(inputId);
      if(input){ input.value += b.textContent; input.focus(); }
    });
  });
  setTimeout(()=>{
    document.addEventListener('click', outsideEmojiClick);
  },0);
}
function outsideEmojiClick(e){
  const pop = document.getElementById('emojiPopup');
  if(pop && !pop.contains(e.target) && !e.target.closest('.emoji-trigger')){
    closeEmoji();
    document.removeEventListener('click', outsideEmojiClick);
  }
}

/* ================= VOICE RECORDING (shared) ================= */
let recorder = { active:false, mediaRecorder:null, chunks:[], timer:null, seconds:0, context:null, chatId:null };

async function startRecording(context, chatId, btnEl, inputRowEl){
  if(recorder.active) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream);
    recorder = { active:true, mediaRecorder:mr, chunks:[], timer:null, seconds:0, context, chatId, stream };
    mr.ondataavailable = e=>{ if(e.data.size>0) recorder.chunks.push(e.data); };
    mr.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      finishRecording();
    };
    mr.start();
    btnEl.classList.add('active-rec');
    inputRowEl.dataset.recording = '1';
    recorder.timer = setInterval(()=>{
      recorder.seconds++;
      const label = inputRowEl.querySelector('.rec-seconds');
      if(label) label.textContent = fmtDur(recorder.seconds);
      if(recorder.seconds >= 120){ stopRecording(); showToast('Достигнут лимит записи — 2 минуты'); }
    },1000);
    renderRecordingUI(inputRowEl, true);
  }catch(err){
    showToast('Нет доступа к микрофону. Разрешите доступ в браузере, чтобы отправлять голосовые.');
  }
}
function renderRecordingUI(inputRowEl, on){
  const textInput = inputRowEl.querySelector('input[type=text]');
  let indicator = inputRowEl.querySelector('.rec-indicator');
  if(on){
    if(textInput) textInput.style.display='none';
    if(!indicator){
      indicator = document.createElement('div');
      indicator.className = 'rec-indicator';
      indicator.innerHTML = `<span class="rec-dot"></span> Запись голосового… <span class="rec-seconds">0:00</span>`;
      inputRowEl.insertBefore(indicator, inputRowEl.querySelector('.mic-btn'));
    }
  }else{
    if(textInput) textInput.style.display='';
    if(indicator) indicator.remove();
  }
}
function stopRecording(){
  if(!recorder.active) return;
  clearInterval(recorder.timer);
  recorder.mediaRecorder.stop();
}
async function finishRecording(){
  const blob = new Blob(recorder.chunks, {type: recorder.mediaRecorder.mimeType || 'audio/webm'});
  const durationSec = recorder.seconds;
  const context = recorder.context, chatId = recorder.chatId;
  recorder = { active:false, mediaRecorder:null, chunks:[], timer:null, seconds:0, context:null, chatId:null };

  if(blob.size > 4.3*1024*1024){
    showToast('Голосовое слишком длинное для сохранения — запишите покороче.');
  }else{
    const reader = new FileReader();
    reader.onload = async ()=>{
      const dataUrl = reader.result;
      const msg = {id:uid(), type:'voice', from:'me', audio:dataUrl, duration:durationSec, time:Date.now()};
      if(context==='chat'){
        const chat = state.chats.find(c=>c.id===chatId);
        if(chat){
          chat.messages.push(msg);
          renderContent();
          await sSet('sputnik_chats_v2', state.chats, false);
          setTimeout(()=>{
            const c = state.chats.find(x=>x.id===chatId);
            if(!c) return;
            c.messages.push({type:'text', from:'them', text: CANNED_REPLIES[Math.floor(Math.random()*CANNED_REPLIES.length)], time:Date.now()});
            if(state.activeChatId===chatId) renderContent();
            sSet('sputnik_chats_v2', state.chats, false);
          }, 1000+Math.random()*800);
        }
      }else if(context==='public'){
        msg.author = state.profile.name;
        state.publicChat.push(msg);
        renderContent();
        await sSet('sputnik_publicchat_v2', state.publicChat, true);
      }
    };
    reader.readAsDataURL(blob);
  }
  // reset any recording UI still shown
  document.querySelectorAll('.thread-input,.public-input').forEach(el=> renderRecordingUI(el,false));
}

function voiceBubbleHtml(m, mine){

    <button class="voice-play" data-id="${m.id}">${ICONS.playSm}</button>
    <div class="voice-wave">${bars.map(h=>`<span style="height:${h}px"></span>`).join('')}</div>
    <span class="voice-dur">${fmtDur(m.duration||0)}</span>

function wireVoicePlayback(scopeEl, messages){
  scopeEl.querySelectorAll('.voice-play').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const msg = messages.find(m=>m.id===btn.dataset.id);
      if(!msg) return;
      if(window._playingAudio && !window._playingAudio.paused){
        window._playingAudio.pause();
        if(window._playingAudioBtn) window._playingAudioBtn.innerHTML = ICONS.playSm;
        if(window._playingAudio.dataset.id === msg.id){ window._playingAudio=null; return; }
      }
      const audio = new Audio(msg.audio);
      audio.dataset.id = msg.id;
      window._playingAudio = audio; window._playingAudioBtn = btn;
      btn.innerHTML = ICONS.pause;
      audio.play().catch(()=> showToast('Не удалось воспроизвести голосовое сообщение.'));
      audio.onended = ()=>{ btn.innerHTML = ICONS.playSm; };
    });
  });
}

let callState = { stream:null, muted:false, camOff:false };
async function openCallModal(name, color, kind){
  const root = document.getElementById('callRoot');
  root.innerHTML = `
    <div class="call-overlay" id="callOverlay">
      <div class="call-demo-badge">Демо-режим: показывает вашу камеру/микрофон, но не соединяет с собеседником — для настоящих звонков нужен отдельный сервер связи.</div>
      <div class="call-avatar" style="background:${color}">${initials(name)}</div>
      <div class="call-name">${esc(name)}</div>
      <div class="call-status" id="callStatusTxt">Вызов…</div>
      ${kind==='video' ? `<div class="call-local-video"><video id="callLocalVideo" autoplay muted playsinline></video></div>` : ''}
      <div class="call-controls">
        <button id="callMicBtn">${ICONS.mic}</button>
        ${kind==='video' ? `<button id="callCamBtn">${ICONS.videoCam}</button>` : ''}
        <button class="end" id="callEndBtn">${ICONS.hangup}</button>
      </div>
    </div>`;
  document.getElementById('callEndBtn').addEventListener('click', endCall);
  setTimeout(()=>{ const s=document.getElementById('callStatusTxt'); if(s) s.textContent='Соединение…'; },900);
  setTimeout(()=>{ const s=document.getElementById('callStatusTxt'); if(s) s.textContent='Демонстрация подключена'; },2000);

  callState = { stream:null, muted:false, camOff:false };
  try{
    const constraints = kind==='video' ? {audio:true,video:true} : {audio:true};
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    callState.stream = stream;
    if(kind==='video'){
      const v = document.getElementById('callLocalVideo');
      if(v) v.srcObject = stream;
    }
  }catch(err){
    showToast('Нет доступа к камере/микрофону — показан только интерфейс звонка.');
  }
  document.getElementById('callMicBtn').addEventListener('click', ()=>{
    callState.muted = !callState.muted;
    if(callState.stream) callState.stream.getAudioTracks().forEach(t=> t.enabled = !callState.muted);
    document.getElementById('callMicBtn').classList.toggle('on', !callState.muted);
    document.getElementById('callMicBtn').innerHTML = callState.muted ? ICONS.micOff : ICONS.mic;
  });
  const camBtn = document.getElementById('callCamBtn');
  if(camBtn){
    camBtn.addEventListener('click', ()=>{
      callState.camOff = !callState.camOff;
      if(callState.stream) callState.stream.getVideoTracks().forEach(t=> t.enabled = !callState.camOff);
      camBtn.classList.toggle('on', !callState.camOff);
      camBtn.innerHTML = callState.camOff ? ICONS.camOff : ICONS.videoCam;
    });
  }
}
function endCall(){
  if(callState.stream) callState.stream.getTracks().forEach(t=>t.stop());
  document.getElementById('callRoot').innerHTML='';
}

function renderThreadHtml(chat){

function isMobileNow(){ return window.innerWidth <= 820; }

function wireThreadEvents(activeChat){
  const back = document.getElementById('backToList');
  if(back) back.addEventListener('click', ()=>{ state.mobileThreadOpen=false; renderContent(); });
  const input = document.getElementById('chatInput');
  if(!input) return;
  const sendBtn = document.getElementById('chatSendBtn');
  const micBtn = document.getElementById('chatMicBtn');
  const inputRow = document.getElementById('threadInputRow');
  const emojiBtn = document.getElementById('chatEmojiBtn');
  const scopeBody = document.getElementById('threadBody');
  wireVoicePlayback(scopeBody, activeChat.messages);

  document.getElementById('audioCallBtn').addEventListener('click', ()=> startCallFromChat(activeChat, 'audio'));
  document.getElementById('videoCallBtn').addEventListener('click', ()=> startCallFromChat(activeChat, 'video'));

  const toggleSendMic = ()=>{
    const has = input.value.trim().length>0;
    sendBtn.style.display = has ? 'inline-flex' : 'none';
    micBtn.style.display = has ? 'none' : 'flex';
  };
  input.addEventListener('input', toggleSendMic);
  toggleSendMic();

  emojiBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleEmoji(inputRow, 'chatInput'); });

  const send = ()=>{
    const text = input.value.trim();
    if(!text) return;
    const chat = state.chats.find(c=>c.id===state.activeChatId);
    chat.messages.push({type:'text', from:'me', text, time:Date.now()});
    input.value=''; toggleSendMic();
    renderContent();
    sSet('sputnik_chats_v2', state.chats, false);
    setTimeout(()=>{
      const c = state.chats.find(x=>x.id===chat.id);
      if(!c) return;
      c.messages.push({type:'text', from:'them', text: CANNED_REPLIES[Math.floor(Math.random()*CANNED_REPLIES.length)], time:Date.now()});
      if(state.activeChatId===chat.id) renderContent();
      sSet('sputnik_chats_v2', state.chats, false);
    }, 900+Math.random()*900);
  };
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

  micBtn.addEventListener('mousedown', (e)=>{ e.preventDefault(); startRecording('chat', activeChat.id, micBtn, inputRow); });
  micBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); startRecording('chat', activeChat.id, micBtn, inputRow); });
  const stopIfRecording = ()=>{ if(recorder.active && recorder.context==='chat') stopRecording(); micBtn.classList.remove('active-rec'); };
  micBtn.addEventListener('mouseup', stopIfRecording);
  micBtn.addEventListener('mouseleave', stopIfRecording);
  micBtn.addEventListener('touchend', stopIfRecording);
}
function scrollThreadBottom(){ const body=document.getElementById('threadBody'); if(body) body.scrollTop=body.scrollHeight; }

let composerMedia = { type:null, photoDataUrl:null, videoUrl:null, videoDurationSec:0, videoThumb:null, musicName:null };

function resetComposerMedia(){ composerMedia = { type:null, photoDataUrl:null, videoUrl:null, videoDurationSec:0, videoThumb:null, musicName:null }; }

  const q = state.search.trim().toLowerCase();
  const base = feedFilter==='all' ? state.feed.filter(p=>p.public) : state.feed.filter(p=>state.myPostIds.includes(p.id));

      </div>
      <div class="composer-foot">
        <div class="privacy-toggle"><div class="switch ${composerPublic?'':'on'}" id="privSwitch"></div><span id="privLabel">${composerPublic?'Публично — видят все':'Приватно — видите только вы'}</span></div>

      </div>

      <button data-f="all" class="${feedFilter==='all'?'active':''}">Все посты</button>

  document.querySelectorAll('.pill-toggle button[data-f]').forEach(b=> b.addEventListener('click', ()=>{ feedFilter=b.dataset.f; renderFeed(el); }));

  document.getElementById('attachVideoBtn').addEventListener('click', ()=> document.getElementById('videoInput').click());
  document.getElementById('attachMusicBtn').addEventListener('click', ()=>{ if(composerMedia.type==='photo') document.getElementById('musicInput').click(); });

  document.getElementById('photoInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const dataUrl = await compressImageToDataUrl(file, 900);
    composerMedia = { type:'photo', photoDataUrl:dataUrl, videoUrl:null, videoDurationSec:0, videoThumb:null, musicName:composerMedia.musicName };
    renderFeed(el);
  });

    const file = e.target.files[0]; if(!file) return;

    const meta = await readVideoMeta(url);
    if(meta.duration > 300){
      showToast('Видео дольше 5 минут — выберите файл покороче.');
      URL.revokeObjectURL(url);
      return;

    composerMedia = { type:'video', photoDataUrl:null, videoUrl:url, videoDurationSec:meta.duration, videoThumb:meta.thumb, musicName:null };

      public:composerPublic, time:Date.now(), likes:0, likedByMe:false,
      mediaType: composerMedia.type,
      photo: composerMedia.type==='photo' ? composerMedia.photoDataUrl : null,
      musicName: composerMedia.musicName,

  return `<div class="post-card">
    <div class="post-head">

function emptyFeedHtml(q){

}

function compressImageToDataUrl(file, maxDim){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = ()=>{
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function readVideoMeta(url){
  return new Promise((resolve)=>{
    const v = document.createElement('video');
    v.src = url; v.muted = true; v.playsInline = true;
    v.addEventListener('loadedmetadata', ()=>{
      v.currentTime = Math.min(1, v.duration/2);
    });
    v.addEventListener('seeked', ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = 320; canvas.height = Math.round(320*(v.videoHeight/v.videoWidth||0.56));
      canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
      resolve({duration:v.duration, thumb:canvas.toDataURL('image/jpeg',0.75)});
    });
    v.addEventListener('error', ()=> resolve({duration:0, thumb:''}));
  });
}

/* ================= CHANNELS ================= */
const ACCESS_TYPES = [
  {id:'public', label:'Открытый доступ', sub:'Виден всем', icon:'globe'},
  {id:'private', label:'Закрытый доступ', sub:'Видите только вы', icon:'lock'},
  {id:'invite', label:'По приглашению', sub:'Только по ссылке', icon:'invite'},
  {id:'scheduled', label:'Запланировать', sub:'Откроется позже', icon:'clock'},
];
function accessGridHtml(current, prefix){
  return `<div class="access-grid" id="${prefix}AccessGrid">
    ${ACCESS_TYPES.map(a=>`<button type="button" class="access-opt ${current===a.id?'active':''}" data-access="${a.id}">${ICONS[a.icon]}<span><span class="at">${a.label}</span><span class="as">${a.sub}</span></span></button>`).join('')}
  </div>
  <div class="field" id="${prefix}ScheduleField" style="display:${current==='scheduled'?'block':'none'};margin-top:10px;">
    <label>Дата и время открытия</label><input type="datetime-local" id="${prefix}ScheduleInput">
  </div>`;
}
function wireAccessGrid(prefix, stateObj){
  document.getElementById(prefix+'AccessGrid').querySelectorAll('.access-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      stateObj.access = btn.dataset.access;
      document.getElementById(prefix+'AccessGrid').querySelectorAll('.access-opt').forEach(b=>b.classList.toggle('active', b===btn));
      document.getElementById(prefix+'ScheduleField').style.display = stateObj.access==='scheduled' ? 'block' : 'none';
    });
  });
}
function accessBadgeHtml(access, scheduledAt){
  const a = ACCESS_TYPES.find(x=>x.id===access) || ACCESS_TYPES[0];
  if(access==='scheduled' && scheduledAt && scheduledAt>Date.now()){
    return `<span class="badge-lock">${ICONS.clock} До ${new Date(scheduledAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>`;
  }
  return `<span class="badge-lock">${ICONS[a.icon]} ${a.label}</span>`;
}
function isVisibleToMe(item, isOwner){
  if(item.access==='public') return true;
  if(isOwner) return true;
  if(item.access==='scheduled') return item.scheduledAt && item.scheduledAt<=Date.now();
  return false; // private/invite: only owner in this demo (no real invite-link system / accounts)
}

function renderChannels(el){
  if(state.activeChannelId) return renderChannelDetail(el, state.activeChannelId);
  const q = state.search.trim().toLowerCase();
  const visible = state.channels.filter(c => isVisibleToMe(c, state.myChannelIds.includes(c.id)));
  const filtered = visible.filter(c => !q || c.name.toLowerCase().includes(q) || (c.description||'').toLowerCase().includes(q));

  el.innerHTML = `
    <div class="channels-toolbar"><button class="btn" id="newChannelBtn">${ICONS.plus} Создать канал</button></div>
    <div class="channel-grid">
      ${filtered.length ? filtered.map(c=>channelCardHtml(c,q)).join('') :
        (q ? `<div class="empty-state" style="grid-column:1/-1;">${ICONS.search}<div class="es-title">Ничего не найдено</div></div>`
            : `<div class="empty-state" style="grid-column:1/-1;">${ICONS.channels}<div class="es-title">Каналов пока нет</div><div class="es-sub">Создайте свой канал и выберите уровень доступа.</div></div>`)}
    </div>`;
  document.getElementById('newChannelBtn').addEventListener('click', openChannelModal);
  el.querySelectorAll('.channel-card').forEach(card=> card.addEventListener('click', ()=>{ state.activeChannelId=card.dataset.id; state.search=''; renderContent(); renderTopbar(); }));
}
function channelCardHtml(c,q){
  const postCount = state.channelPosts.filter(p=>p.channelId===c.id).length;
  return `<div class="channel-card" data-id="${c.id}">
    <div class="channel-cover" style="background:${colorFor(c.id)}">${(c.name||'?')[0].toUpperCase()}</div>
    <div class="cname">${highlight(c.name,q)}</div>
    <div class="cdesc">${highlight(c.description||'Без описания',q)}</div>
    <div class="cfoot"><span>${postCount} публикаций</span>${accessBadgeHtml(c.access||'public', c.scheduledAt)}</div>
  </div>`;
}

function renderChannelDetail(el, channelId){
  const channel = state.channels.find(c=>c.id===channelId);
  if(!channel){ state.activeChannelId=null; return renderChannels(el); }
  const isOwner = state.myChannelIds.includes(channel.id);
  const q = state.search.trim().toLowerCase();
  const posts = state.channelPosts.filter(p=>p.channelId===channelId)
    .filter(p=> isVisibleToMe(p, isOwner))
    .filter(p=> !q || p.title.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q))
    .sort((a,b)=>b.time-a.time);

  el.innerHTML = `
    <div style="padding:24px 28px 100px;">
    <button class="back-link" id="backToChannels">${ICONS.back} Все каналы</button>
    <div class="channel-detail-head">
      <div class="cover-lg" style="background:${colorFor(channel.id)}">${(channel.name||'?')[0].toUpperCase()}</div>
      <div style="flex:1;min-width:180px;">
        <h2 style="font-family:'Space Grotesk',sans-serif;margin:0 0 4px;font-size:20px;">${esc(channel.name)}</h2>
        <div style="color:var(--text-muted);font-size:13px;">${esc(channel.description||'')}</div>
      </div>
      ${accessBadgeHtml(channel.access||'public', channel.scheduledAt)}
    </div>
    <div>
      ${posts.length ? posts.map(p=>videoPostHtml(p, channel, q)).join('') :
        (q ? `<div class="empty-state">${ICONS.search}<div class="es-title">Ничего не найдено</div></div>`
            : `<div class="empty-state">${ICONS.channels}<div class="es-title">Пока нет публикаций</div><div class="es-sub">${isOwner ? 'Нажмите + внизу, чтобы добавить видео, короткое видео или начать трансляцию.' : 'Владелец канала ещё ничего не выложил.'}</div></div>`)}
    </div>
    </div>
    ${isOwner ? `<div class="fab-wrap" id="fabWrap"><button class="fab" id="fabBtn">${ICONS.plusBig}</button></div>` : ''}
  `;
  document.getElementById('backToChannels').addEventListener('click', ()=>{ state.activeChannelId=null; state.search=''; renderContent(); renderTopbar(); });
  el.querySelectorAll('.play-channel-video').forEach(btn=> btn.addEventListener('click', ()=> playSessionVideo(btn.dataset.id)));

  const fabBtn = document.getElementById('fabBtn');
  if(fabBtn){
    fabBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(document.getElementById('fabMenu')){ document.getElementById('fabMenu').remove(); return; }
      const menu = document.createElement('div');
      menu.className='fab-menu'; menu.id='fabMenu';
      menu.innerHTML = `
        <button data-a="video">${ICONS.film} Загрузить видео</button>
        <button data-a="short">${ICONS.live} Загрузить короткое видео</button>
        <button data-a="live">${ICONS.live} Начать трансляцию</button>`;
      document.getElementById('fabWrap').appendChild(menu);
      menu.querySelector('[data-a="video"]').addEventListener('click', ()=>{ menu.remove(); openVideoModal(channel.id,'video'); });
      menu.querySelector('[data-a="short"]').addEventListener('click', ()=>{ menu.remove(); openVideoModal(channel.id,'short'); });
      menu.querySelector('[data-a="live"]').addEventListener('click', ()=>{ menu.remove(); openLiveModal(channel.id); });
      setTimeout(()=> document.addEventListener('click', function h(ev){ if(!menu.contains(ev.target) && ev.target!==fabBtn){ menu.remove(); document.removeEventListener('click',h);} }),0);
    });
  }
}
function videoPostHtml(p, channel, q){
  const kindBadge = p.kind==='short' ? '<span class="badge-lock">Короткое видео</span>' : p.kind==='live' ? '<span class="badge-live">● В ЭФИРЕ (демо)</span>' : '';
  return `<div class="video-post">
    <div class="video-thumb ${sessionVideoUrls[p.id]?'play-channel-video':''}" data-id="${p.id}" style="cursor:${sessionVideoUrls[p.id]?'pointer':'default'};background:linear-gradient(135deg, ${colorFor(p.id)}, ${colorFor(channel.id)})">
      ${p.videoThumb?`<img src="${p.videoThumb}">`:''}${ICONS.play}${p.durationSec?`<div class="dur-badge">${fmtDur(p.durationSec)}</div>`:''}
    </div>
    <div class="video-info">
      <div class="vtitle">${highlight(p.title,q)}</div>
      <div class="vdesc">${highlight(p.desc||'',q)}</div>
      <div class="vfoot"><span>${timeAgo(p.time)} назад</span>${kindBadge}${accessBadgeHtml(p.access||'public', p.scheduledAt)}</div>
    </div>
  </div>`;
}

let videoModalState = {access:'public', file:null, url:null, thumb:null, duration:0};
function openVideoModal(channelId, kind){
  videoModalState = {access:'public', file:null, url:null, thumb:null, duration:0};
  const root = document.getElementById('modalRoot');
  const kindLabel = kind==='short' ? 'короткое видео' : 'видео';
  root.innerHTML = `<div class="modal-overlay" id="ov"><div class="modal">
    <h3>Новая публикация — ${kindLabel}</h3>
    <div class="field"><label>Файл ${kindLabel}${kind==='video'?' (без ограничения по длительности)':' (рекомендуется до 60 секунд)'}</label>
      <div id="videoDropSlot"><div class="video-drop" id="videoDropZone">${ICONS.film}<br>Нажмите, чтобы выбрать файл</div></div>
      <input type="file" id="vfile" accept="video/*" style="display:none;">
    </div>
    <div class="field"><label>Заголовок</label><input id="vtitle" placeholder="Название публикации"></div>
    <div class="field"><label>Описание</label><textarea id="vdesc" placeholder="О чём эта публикация?"></textarea></div>
    <div class="field"><label>Доступ к публикации</label>${accessGridHtml('public','vid')}</div>
    <div class="modal-actions"><button class="btn ghost" id="cancel">Отмена</button><button class="btn" id="publish">Опубликовать</button></div>
  </div></div>`;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
  document.getElementById('cancel').addEventListener('click', closeModal);
  wireAccessGrid('vid', videoModalState);
  document.getElementById('videoDropZone').addEventListener('click', ()=> document.getElementById('vfile').click());
  document.getElementById('vfile').addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const url = URL.createObjectURL(file);
    const meta = await readVideoMeta(url);
    videoModalState.file = file; videoModalState.url = url; videoModalState.thumb = meta.thumb; videoModalState.duration = meta.duration;
    document.getElementById('videoDropSlot').innerHTML = `<div class="video-drop-preview"><video src="${url}" controls></video></div><div class="video-drop" id="videoDropZone2" style="padding:8px;">Выбрать другой файл (${fmtDur(meta.duration)})</div>`;
    document.getElementById('videoDropZone2').addEventListener('click', ()=> document.getElementById('vfile').click());
  });
  document.getElementById('publish').addEventListener('click', async ()=>{
    const title = document.getElementById('vtitle').value.trim();
    if(!title){ showToast('Укажите заголовок публикации.'); return; }
    if(!videoModalState.file){ showToast('Выберите видеофайл.'); return; }
    const desc = document.getElementById('vdesc').value.trim();
    let scheduledAt = null;
    if(videoModalState.access==='scheduled'){
      const v = document.getElementById('vidScheduleInput').value;
      if(v) scheduledAt = new Date(v).getTime();
    }
    const post = {id:uid(), channelId, title, desc, kind, access:videoModalState.access, scheduledAt,
      durationSec:videoModalState.duration, videoThumb:videoModalState.thumb, time:Date.now()};
    state.channelPosts.push(post);
    sessionVideoUrls[post.id] = videoModalState.url;
    closeModal(); render();
    await sSet('sputnik_channelposts_v2', state.channelPosts, true);
    showToast('Публикация добавлена. Видео воспроизводится в этой сессии — для постоянного хранения нужен видеосервер.');
  });
}

function openLiveModal(channelId){

    <div class="modal-actions"><button class="btn ghost" id="cancel">Отмена</button><button class="btn" id="golive">Выйти в эфир</button></div>

async function runLivePreview(title){
  const root = document.getElementById('callRoot');
  root.innerHTML = `<div class="call-overlay" id="liveOverlay">
    <div class="call-demo-badge">Демо-трансляция: видно только вам. Реальным зрителям нужен сервер трансляций.</div>
    <div style="width:min(560px,90vw);border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--border);">
      <video id="liveVideo" autoplay muted playsinline style="width:100%;display:block;"></video>
    </div>
    <div class="call-name" style="margin-top:16px;">🔴 ${esc(title)}</div>
    <div class="call-status">Вы в эфире (демо)</div>
    <div class="call-controls"><button class="end" id="liveEndBtn">${ICONS.hangup}</button></div>
  </div>`;
  let stream = null;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    document.getElementById('liveVideo').srcObject = stream;
  }catch(err){ showToast('Нет доступа к камере — трансляция не может начаться.'); }
  document.getElementById('liveEndBtn').addEventListener('click', ()=>{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    document.getElementById('callRoot').innerHTML='';
  });
}
